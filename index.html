<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Kasir</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f5f5f5;
            padding: 20px;
        }

        .container {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .card {
            background: white;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #007bff;
        }

        h1 {
            font-size: 24px;
            color: #333;
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .search-box input {
            flex: 1;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
        }

        .search-box button {
            padding: 10px 20px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
        }

        .search-box button:hover {
            background: #0056b3;
        }

        .products-list {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 20px;
            max-height: 400px;
            overflow-y: auto;
        }

        .product-item {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 6px;
            border: 1px solid #ddd;
            cursor: pointer;
            transition: all 0.3s;
        }

        .product-item:hover {
            background: #e9ecef;
            border-color: #007bff;
            transform: translateY(-2px);
        }

        .product-name {
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
        }

        .product-price {
            color: #007bff;
            font-weight: 700;
            font-size: 16px;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            background: #f8f9fa;
            border-radius: 4px;
            margin-bottom: 10px;
            border-left: 3px solid #007bff;
        }

        .cart-item-info {
            flex: 1;
        }

        .cart-item-name {
            font-weight: 600;
            color: #333;
        }

        .cart-item-qty {
            color: #666;
            font-size: 13px;
        }

        .cart-item-price {
            color: #007bff;
            font-weight: 700;
            margin-right: 10px;
        }

        .qty-controls {
            display: flex;
            gap: 5px;
            align-items: center;
        }

        .qty-btn {
            width: 24px;
            height: 24px;
            border: 1px solid #ddd;
            background: white;
            cursor: pointer;
            border-radius: 3px;
            font-size: 12px;
        }

        .qty-btn:hover {
            background: #f0f0f0;
        }

        .delete-btn {
            background: #dc3545;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 12px;
        }

        .delete-btn:hover {
            background: #c82333;
        }

        .cart-summary {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 6px;
            margin-top: 20px;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            padding: 8px 0;
            border-bottom: 1px solid #ddd;
        }

        .summary-row:last-child {
            border-bottom: none;
            font-weight: 700;
            font-size: 18px;
            color: #007bff;
            padding-top: 10px;
            border-top: 2px solid #ddd;
        }

        .label {
            color: #666;
        }

        .value {
            font-weight: 600;
            color: #333;
        }

        .buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 20px;
        }

        .btn {
            padding: 12px;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: #007bff;
            color: white;
        }

        .btn-primary:hover {
            background: #0056b3;
        }

        .btn-danger {
            background: #dc3545;
            color: white;
        }

        .btn-danger:hover {
            background: #c82333;
        }

        .btn-success {
            background: #28a745;
            color: white;
            grid-column: 1 / -1;
        }

        .btn-success:hover {
            background: #218838;
        }

        .empty-cart {
            text-align: center;
            color: #999;
            padding: 40px 20px;
            font-style: italic;
        }

        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
            }

            .products-list {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Main Content -->
        <div class="card">
            <div class="header">
                <h1>📦 Sistem Kasir</h1>
                <div style="color: #666;">Tanggal: <span id="tanggal"></span></div>
            </div>

            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Cari produk...">
                <button onclick="searchProduct()">Cari</button>
            </div>

            <h3 style="margin-bottom: 15px; color: #333;">Daftar Produk</h3>
            <div class="products-list" id="productsList"></div>
        </div>

        <!-- Right Sidebar - Cart -->
        <div class="card">
            <h2 style="margin-bottom: 20px; color: #333;">🛒 Keranjang</h2>
            <div id="cartItems"></div>

            <div class="cart-summary">
                <div class="summary-row">
                    <span class="label">Subtotal:</span>
                    <span class="value" id="subtotal">Rp 0</span>
                </div>
                <div class="summary-row">
                    <span class="label">Diskon:</span>
                    <span class="value" id="discountDisplay">Rp 0</span>
                </div>
                <div class="summary-row">
                    <span class="label">Pajak (10%):</span>
                    <span class="value" id="tax">Rp 0</span>
                </div>
                <div class="summary-row">
                    <span class="label">Total:</span>
                    <span class="value" id="total">Rp 0</span>
                </div>
            </div>

            <div class="buttons">
                <button class="btn btn-danger" onclick="clearCart()">Bersihkan</button>
                <button class="btn btn-primary" onclick="printBill()">Cetak</button>
                <button class="btn btn-success" onclick="checkout()">💰 Bayar</button>
            </div>
        </div>
    </div>

    <script>
        // Default products
        const defaultProducts = [
            { id: 1, name: 'Kopi', price: 15000 },
            { id: 2, name: 'Teh', price: 10000 },
            { id: 3, name: 'Smoothie', price: 20000 },
            { id: 4, name: 'Nasi Goreng', price: 25000 },
            { id: 5, name: 'Mie Goreng', price: 22000 },
            { id: 6, name: 'Soto Ayam', price: 18000 }
        ];

        let cart = {};
        let discount = 0;

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            displayProducts(defaultProducts);
            updateDate();
            updateCart();
        });

        function updateDate() {
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            const today = new Date().toLocaleDateString('id-ID', options);
            document.getElementById('tanggal').textContent = today;
        }

        function displayProducts(products) {
            const productsList = document.getElementById('productsList');
            productsList.innerHTML = products.map(product => `
                <div class="product-item" onclick="addToCart(${product.id}, '${product.name}', ${product.price})">
                    <div class="product-name">${product.name}</div>
                    <div class="product-price">Rp ${product.price.toLocaleString('id-ID')}</div>
                </div>
            `).join('');
        }

        function addToCart(id, name, price) {
            if (cart[id]) {
                cart[id].qty++;
            } else {
                cart[id] = { name, price, qty: 1 };
            }
            updateCart();
        }

        function updateQty(id, change) {
            cart[id].qty += change;
            if (cart[id].qty <= 0) {
                delete cart[id];
            }
            updateCart();
        }

        function removeFromCart(id) {
            delete cart[id];
            updateCart();
        }

        function calculateTotal() {
            let subtotal = 0;
            for (let id in cart) {
                subtotal += cart[id].price * cart[id].qty;
            }
            const tax = Math.round(subtotal * 0.1);
            const total = subtotal + tax - discount;
            return { subtotal, tax, total };
        }

        function updateCart() {
            const cartItems = document.getElementById('cartItems');
            const itemCount = Object.keys(cart).length;

            if (itemCount === 0) {
                cartItems.innerHTML = '<div class="empty-cart">Keranjang kosong</div>';
            } else {
                cartItems.innerHTML = Object.entries(cart).map(([id, item]) => `
                    <div class="cart-item">
                        <div class="cart-item-info">
                            <div class="cart-item-name">${item.name}</div>
                            <div class="cart-item-qty">Rp ${item.price.toLocaleString('id-ID')} × ${item.qty}</div>
                        </div>
                        <div class="cart-item-price">Rp ${(item.price * item.qty).toLocaleString('id-ID')}</div>
                        <div class="qty-controls">
                            <button class="qty-btn" onclick="updateQty(${id}, -1)">−</button>
                            <button class="qty-btn" onclick="updateQty(${id}, 1)">+</button>
                            <button class="delete-btn" onclick="removeFromCart(${id})">✕</button>
                        </div>
                    </div>
                `).join('');
            }

            const { subtotal, tax, total } = calculateTotal();
            document.getElementById('subtotal').textContent = 'Rp ' + subtotal.toLocaleString('id-ID');
            document.getElementById('tax').textContent = 'Rp ' + tax.toLocaleString('id-ID');
            document.getElementById('total').textContent = 'Rp ' + total.toLocaleString('id-ID');
            document.getElementById('discountDisplay').textContent = 'Rp ' + discount.toLocaleString('id-ID');
        }

        function clearCart() {
            if (confirm('Yakin ingin mengosongkan keranjang?')) {
                cart = {};
                discount = 0;
                updateCart();
            }
        }

        function searchProduct() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = defaultProducts.filter(p => p.name.toLowerCase().includes(query));
            displayProducts(filtered.length > 0 ? filtered : defaultProducts);
        }

        function printBill() {
            if (Object.keys(cart).length === 0) {
                alert('Keranjang kosong!');
                return;
            }
            window.print();
        }

        function checkout() {
            if (Object.keys(cart).length === 0) {
                alert('Keranjang kosong!');
                return;
            }
            const { total } = calculateTotal();
            alert(`Transaksi selesai!\nTotal: Rp ${total.toLocaleString('id-ID')}`);
            cart = {};
            discount = 0;
            updateCart();
        }
    </script>
</body>
</html>
